server:
  port: 8080

spring:
  application:
    name: pokemanager

  datasource:
    url: jdbc:postgresql://localhost:5432/pokemanager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway cuida do schema, JPA só valida
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration