server:
  port: 8080

spring:
  application:
    name: pokemanager

  datasource:
    url: jdbc:postgresql://localhost:5432/pokemanager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway cuida do schema, JPA só valida
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  loki:
    url: ${GC_LOKI_URL:http://localhost:3100/loki/api/v1/push}
    user: ${GC_LOKI_USER:}
    api-key: ${GC_API_KEY:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 horas